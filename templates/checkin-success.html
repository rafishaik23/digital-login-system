<!DOCTYPE html>
<html>

<head>
    <title>Check-in Successful</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="form-container checkin-success-card" role="status">
        <div class="login-brand">
            <img src="{{ url_for('static', filename='swechalogo.png') }}"
                 alt="Swecha Andhra Pradesh logo">
        </div>

        <h1><span class="success-check" aria-hidden="true">&#10003;</span>Check-in Successful</h1>
        <p class="checkin-success-welcome">Welcome, {{ checkin.user_name }}!</p>

        <div class="checkin-confirmation">
            <p>Check-in ID: <strong>{{ checkin.checkin_id }}</strong></p>
            <p>Check-in time: <strong>{{ checkin.checkin_time }}</strong></p>
        </div>

        <p class="checkin-success-active">Your visit is now active.</p>
        <a class="home-action home-action-primary checkin-success-action"
           href="{{ url_for('home') }}">Back to Home</a>
    </main>
</body>

</html>
