
<!DOCTYPE html>
<html>

<head>
    <title>Swecha Knowledge Center | Visitor Logbook</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="home-page">
    <main class="home-panel">
        <div class="home-logo">
            <img src="{{ url_for('static', filename='swechalogo.png') }}"
                 alt="Swecha Andhra Pradesh logo">
        </div>

        <p class="home-organization">Swecha Knowledge Center</p>
        <h1>Digital Visitor Logbook</h1>

        <nav class="home-actions" aria-label="Choose an action">
            <a class="home-action home-action-primary"
               href="{{ url_for('login') }}">Visitor Check-in</a>
            <a class="home-action home-action-secondary"
               href="{{ url_for('admin_login') }}">Admin Login</a>
        </nav>

        <p class="home-register">
            New visitor?
            <a href="{{ url_for('register') }}">Register here</a>
        </p>

        <section class="home-tribute" aria-labelledby="tribute-title">
            <blockquote>
                "Be curious. Read widely. Try new things. What people call intelligence just boils down to curiosity."
            </blockquote>
            <p class="tribute-attribution">Aaron Swartz</p>
        </section>
    </main>

</body>

</html>
